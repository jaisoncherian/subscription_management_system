services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexbill
      POSTGRES_DB: nexbill
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexbill_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexbill -d nexbill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexbill_db:
